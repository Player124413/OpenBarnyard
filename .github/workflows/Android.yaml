name: Android

on:
  push:
    paths:
      - "Android/**"
      - ".github/workflows/Android.yaml"
  pull_request:
    paths:
      - "Android/**"
      - ".github/workflows/Android.yaml"
  workflow_dispatch:

concurrency:
  group: Android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (host C++ + JVM + sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Native core tests (gcc, -Werror) + contract sync checks
        run: sh Android/tools/run_host_tests.sh

      - name: Native core tests (clang)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang > /dev/null
          CXX=clang++ sh Android/tools/run_host_tests.sh

      - name: Launcher core tests (plain JVM)
        run: python3 Android/build.py --test

      - name: Java syntax sweep (javalang)
        run: |
          pip install -q javalang
          python3 - <<'EOF'
          import glob, sys
          import javalang
          bad = []
          for f in sorted(glob.glob('Android/**/*.java', recursive=True)):
              try:
                  javalang.parse.parse(open(f, encoding='utf-8').read())
              except Exception as exc:
                  bad.append((f, exc))
          for f, exc in bad:
              print('PARSE FAIL', f, exc)
          print('parsed OK' if not bad else 'FAILURES')
          sys.exit(1 if bad else 0)
          EOF

  build:
    name: Build APKs (all ABIs)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21: current cmdline-tools/sdkmanager require it. Our code still
      # compiles to Java 8 bytecode (see build.py strategies), so this does
      # not raise the app's requirements in any way.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # GitHub's ubuntu images ship an Android SDK. Google's repository no
      # longer serves some legacy package names (e.g. platforms;Android-34),
      # so the strategy is: reuse whatever is preinstalled (build.py accepts
      # any platform >= 34 and picks a sane NDK), and only ask sdkmanager for
      # what is truly missing — non-fatally, then re-verify.
      - name: Ensure Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/Android/sdk}}"
          echo "SDK=$SDK JAVA_HOME=$JAVA_HOME"
          echo "platforms:";   ls "$SDK/platforms"   2>/dev/null || true
          echo "build-tools:"; ls "$SDK/build-tools" 2>/dev/null || true
          echo "ndks:";        ls "$SDK/ndk"         2>/dev/null || true
          cat > /tmp/sdk_check.py <<'PYEOF'
          import os, re, sys
          sdk = sys.argv[1]
          def vkey(name):
              return [int(x) for x in re.findall(r"\d+", name)]
          need, have_platform, have_tools, ndk_choice = [], False, False, ""
          pdir = os.path.join(sdk, "platforms")
          if os.path.isdir(pdir):
              for name in os.listdir(pdir):
                  m = re.match(r"Android-(\d+)", name)
                  if m and int(m.group(1)) >= 34 and os.path.isfile(os.path.join(pdir, name, "Android.jar")):
                      have_platform = True
          if not have_platform:
              need.append("platforms;Android-34")
          bdir = os.path.join(sdk, "build-tools")
          if os.path.isdir(bdir):
              have_tools = any(os.path.isfile(os.path.join(bdir, d, "aapt2")) for d in os.listdir(bdir))
          if not have_tools:
              need.append("build-tools;34.0.0")
          ndir = os.path.join(sdk, "ndk")
          ndks = sorted(os.listdir(ndir), key=vkey) if os.path.isdir(ndir) else []
          def pick(cands):
              for pref in ("27.2.12479018",):
                  if pref in cands: return pref
              for major in ("27.", "26.", "25.", "24.", "23."):
                  hits = [c for c in cands if c.startswith(major)]
                  if hits: return hits[-1]
              return cands[-1] if cands else ""
          ndk_choice = pick(ndks)
          if not ndks:
              need.append("ndk;27.2.12479018")
          elif ndk_choice != "27.2.12479018":
              need.append("ndk;27.2.12479018")  # preferred, but non-fatal if it fails
          open("/tmp/sdk_need.txt", "w").write("\n".join(need))
          open("/tmp/sdk_state.txt", "w").write(f"platform={have_platform} tools={have_tools} ndk={ndk_choice}\n")
          print("need:", need, "| state:", open("/tmp/sdk_state.txt").read().strip())
          PYEOF
          python3 /tmp/sdk_check.py "$SDK"
          if [ -s /tmp/sdk_need.txt ]; then
            SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
            if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
            if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
              echo "Trying sdkmanager for: $(tr '\n' ' ' < /tmp/sdk_need.txt)"
              yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
              # shellcheck disable=SC2046
              "$SDKMANAGER" $(cat /tmp/sdk_need.txt) > /tmp/sdk-install.log 2>&1                 || echo "::warning::sdkmanager could not install some packages; will check if preinstalled ones suffice"
              tr '\r' '\n' < /tmp/sdk-install.log | grep -vE '^\s*$' | tail -n 8 || true
            else
              echo "::warning::sdkmanager not found; relying on preinstalled SDK only"
            fi
            python3 /tmp/sdk_check.py "$SDK"
          fi
          grep -q "platform=True" /tmp/sdk_state.txt || { echo "::error::No Android platform >= 34 available"; exit 1; }
          grep -q "tools=True" /tmp/sdk_state.txt || { echo "::error::No build-tools (aapt2) available"; exit 1; }
          NDKNAME="$(sed -n 's/.*ndk=//p' /tmp/sdk_state.txt)"
          if [ -d "$SDK/ndk/27.2.12479018" ]; then NDKNAME="27.2.12479018"; fi
          [ -n "$NDKNAME" ] || { echo "::error::No NDK available"; exit 1; }
          echo "Using SDK=$SDK NDK=$SDK/ndk/$NDKNAME"
          echo "Android_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Android_NDK_HOME=$SDK/ndk/$NDKNAME" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          # Optional release signing (falls back to a debug keystore when unset)
          OB_KEYSTORE: ${{ secrets.OB_KEYSTORE_PATH }}
          OB_KEYSTORE_PASS: ${{ secrets.OB_KEYSTORE_PASS }}
          OB_KEY_ALIAS: ${{ secrets.OB_KEY_ALIAS }}
          OB_KEY_PASS: ${{ secrets.OB_KEY_PASS }}
        run: python3 Android/build.py

      - name: Verify APK structure & ELF ABIs
        run: python3 Android/verify_apk.py Android/dist/*.apk

      - name: aapt2 badging sanity
        run: |
          AAPT2=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | sort -V | tail -1)
          for apk in Android/dist/*.apk; do
            echo "== $apk"
            "$AAPT2" dump badging "$apk" | grep -E "^(package|application:|launchable-activity|native-code|sdkVersion|targetSdkVersion)" || true
          done

      - name: Summary
        run: |
          {
            echo "## OpenBarnyard Android build"
            echo '| Artifact | Size |'
            echo '|---|---|'
            for f in Android/dist/*; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: openbarnyard-Android
          path: Android/dist/*
          retention-days: 30

  emulator-smoke:
    name: Emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    # Best-effort: emulators on shared runners can be flaky/slow. The build
    # and unit-test jobs above are the gating signal; this job adds a real
    # "install + launch + touch" run with screenshots when it succeeds.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: openbarnyard-Android
          path: Android/dist

      - name: Run on emulator (API 30, x86_64)
        uses: reactivecircus/Android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: sh Android/tools/emulator_smoke.sh Android/dist/*-universal.apk emulator-out

      - name: Upload screenshots & logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-output
          path: emulator-out/*
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: openbarnyard-Android
          path: Android/dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Android/dist/*.apk
            Android/dist/*.zip
            Android/dist/SHA256SUMS.txt
          body: |
            OpenBarnyard Android port.

            **Which APK?** `universal` works everywhere. Or pick your ABI:
            64-bit ARM phones → `arm64-v8a`, old 32-bit ARM phones → `armeabi-v7a`,
            emulators/ChromeOS → `x86_64`, ancient intel tablets → `x86`.

            You need your own PC copy of Barnyard: copy its files into the
            app's GameData folder (the launcher shows the path). No game data
            is included. See Android/README.md for the engine port status.
